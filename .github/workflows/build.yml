name: Build & Publish

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]      # pushing a vX.Y.Z tag builds AND publishes to the Marketplace
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write   # create a GitHub Release (with the VSIX attached) on v* tags

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT: src/LocalModelIntegrator/LocalModelIntegrator.csproj
      CONFIGURATION: Release
      VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild $env:PROJECT -t:Restore -p:Configuration=$env:CONFIGURATION

      - name: Build VSIX
        run: msbuild $env:PROJECT -p:Configuration=$env:CONFIGURATION -p:DeployExtension=false

      - name: Find the VSIX
        id: vsix
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path "src/LocalModelIntegrator/bin/$env:CONFIGURATION" -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $f) { throw "No .vsix was produced." }
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalModelIntegrator
          path: ${{ steps.vsix.outputs.path }}

      # On a vX.Y.Z tag, attach the built VSIX to a GitHub Release for direct download.
      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}

      # On a vX.Y.Z tag, publish to the Visual Studio Marketplace via VsixPublisher.
      # Requires the repo secret VS_MARKETPLACE_PAT (Azure DevOps PAT, scope: Marketplace > Manage,
      # all accessible organizations). Skipped automatically if the secret is absent.
      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VS_MARKETPLACE_PAT != ''
        shell: pwsh
        run: |
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $publisher = Join-Path $installPath "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
          if (-not (Test-Path $publisher)) {
            $publisher = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter VsixPublisher.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $publisher) { throw "VsixPublisher.exe not found on the runner." }
          Write-Host "Using $publisher"
          & $publisher publish `
            -payload "${{ steps.vsix.outputs.path }}" `
            -publishManifest "publishManifest.json" `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
