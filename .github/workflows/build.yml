name: Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # pushing a vX.Y.Z tag builds AND publishes to the Marketplace
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # create a GitHub Release (with the VSIX attached) on v* tags

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT: src/LocalModelIntegrator/LocalModelIntegrator.csproj
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild $env:PROJECT -t:Restore -p:Configuration=$env:CONFIGURATION

      - name: Build VSIX
        run: msbuild $env:PROJECT -p:Configuration=$env:CONFIGURATION -p:DeployExtension=false

      - name: Find the VSIX
        id: vsix
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path "src/LocalModelIntegrator/bin/$env:CONFIGURATION" -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $f) { throw "No .vsix was produced." }
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalModelIntegrator
          path: ${{ steps.vsix.outputs.path }}

      # On a vX.Y.Z tag, attach the built VSIX to a GitHub Release. Download it from the Releases
      # page and upload it by hand at https://marketplace.visualstudio.com/manage
      # (Marketplace auto-publish needs an Azure DevOps PAT, which isn't available here.)
      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}
