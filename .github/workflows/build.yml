name: Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # pushing a vX.Y.Z tag builds AND publishes to the Marketplace
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT: src/LocalModelIntegrator/LocalModelIntegrator.csproj
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild $env:PROJECT -t:Restore -p:Configuration=$env:CONFIGURATION

      - name: Build VSIX
        run: msbuild $env:PROJECT -p:Configuration=$env:CONFIGURATION -p:DeployExtension=false

      - name: Find the VSIX
        id: vsix
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path "src/LocalModelIntegrator/bin/$env:CONFIGURATION" -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $f) { throw "No .vsix was produced." }
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalModelIntegrator
          path: ${{ steps.vsix.outputs.path }}

      # Publishes only when a version tag (vX.Y.Z) is pushed. Requires:
      #   - repo secret VS_MARKETPLACE_PAT  (Azure DevOps PAT, scope: Marketplace > Manage)
      #   - publishManifest.json with your real "publisher" id
      #   - the manifest Version bumped to match the tag (Marketplace versions only go up)
      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $publisher = Join-Path $vs 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          if (-not (Test-Path $publisher)) { throw "VsixPublisher.exe not found at $publisher" }
          & $publisher publish -payload "${{ steps.vsix.outputs.path }}" -publishManifest "publishManifest.json" -personalAccessToken $env:PAT
